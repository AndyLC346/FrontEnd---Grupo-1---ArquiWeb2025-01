<div
  style="text-align: center; margin-top: 20px; margin-bottom: 20px"
  class="encabezado"
>
  <div class="contenedor-encabezado">
    <div class="iconos"></div>

    <div class="contenedor-logo" routerLink="/menu">
      <img src="assets/img/logo.png" alt="Logo" class="logopng" />
      <img src="assets/img/nombrepagina.png" alt="Titulo" class="titulopng" />
    </div>
  </div>
</div>

<div class="container">
  <h1 class="titulo-chats">Lista de Chats</h1>
  <mat-form-field appearance="fill">
    <mat-label>Filtro</mat-label>
    <input
      matInput
      [(ngModel)]="filtro"
      (input)="aplicarFiltro()"
      placeholder="filtrar"
    />
  </mat-form-field>
  <div class="tabla-contenedor">
    <table
      mat-table
      [dataSource]="dataSource"
      class="mat-elevation-z8 tabla-estilizada"
    >
      <ng-container matColumnDef="c1">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let element">{{ element.idChat }}</td>
      </ng-container>

      <ng-container matColumnDef="c2">
        <th mat-header-cell *matHeaderCellDef>Contenido</th>
        <td mat-cell *matCellDef="let element">{{ element.contenido }}</td>
      </ng-container>

      <ng-container matColumnDef="c3">
        <th mat-header-cell *matHeaderCellDef>Fecha Inicio</th>
        <td mat-cell *matCellDef="let element">
          {{ element.fechaInicioChat }}
        </td>
      </ng-container>

      <ng-container matColumnDef="c4">
        <th mat-header-cell *matHeaderCellDef>ID Usuario</th>
        <td mat-cell *matCellDef="let element">{{ element.user.username }}</td>
      </ng-container>

      <ng-container matColumnDef="c5">
        <th mat-header-cell *matHeaderCellDef>ID tienda</th>
        <td mat-cell *matCellDef="let element">
          {{ element.tienda.nombreTienda }}
        </td>
      </ng-container>

      <ng-container matColumnDef="c6">
        <th mat-header-cell *matHeaderCellDef>Actualizar</th>
        <td mat-cell *matCellDef="let element">
          <button matButton [routerLink]="['ediciones', element.idChat]">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="c7">
        <th mat-header-cell *matHeaderCellDef>Eliminar</th>
        <td mat-cell *matCellDef="let element">
          <button matButton (click)="eliminar(element.idChat)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
  <mat-paginator
    #paginator
    [length]="dataSource.data.length"
    [pageSize]="4"
    [pageSizeOptions]="[4, 8, 10]"
    showFirstLastButtons
    aria-label="Selecciona página"
  >
  </mat-paginator>
</div>
