<div class="container">
  <div style="text-align: center; margin: 6%;">
    <h1>Lista de Reseñas</h1>
  </div>

  <div class="tabla-contenedor">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 tabla-estilizada">

      <ng-container matColumnDef="c1">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.idResena}} </td>
      </ng-container>

      <ng-container matColumnDef="c2">
        <th mat-header-cell *matHeaderCellDef> Calificacion </th>
        <td mat-cell *matCellDef="let element"> {{element.calificacion}} </td>
      </ng-container>


      <ng-container matColumnDef="c3">
        <th mat-header-cell *matHeaderCellDef> Usuario </th>
        <td mat-cell *matCellDef="let element"> {{element.user.username}} </td>
      </ng-container>


      <ng-container matColumnDef="c4">
        <th mat-header-cell *matHeaderCellDef> Producto </th>
        <td mat-cell *matCellDef="let element"> {{element.producto.nombreProducto}} </td>
      </ng-container>


      <ng-container matColumnDef="c5">
        <th mat-header-cell *matHeaderCellDef> Ver más </th>
        <td mat-cell *matCellDef="let element">
          <a mat-icon-button color="primary" [routerLink]="['detalleresena', element.idResena]">
            <mat-icon>open_in_new</mat-icon>
          </a>
        </td>
      </ng-container>


      <ng-container matColumnDef="c6">
        <th mat-header-cell *matHeaderCellDef> Actualizar </th>
        <td mat-cell *matCellDef="let element">
          <button matButton [routerLink]="['actualizaresena',element.idResena]">
            Actualizar</button>
        </td>
      </ng-container>



      <ng-container matColumnDef="c7">
        <th mat-header-cell *matHeaderCellDef> Eliminar </th>
        <td mat-cell *matCellDef="let element">
          <button matButton (click)="eliminar(element.idResena)">

            Eliminar</button>
        </td>
      </ng-container>


      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

</div>
