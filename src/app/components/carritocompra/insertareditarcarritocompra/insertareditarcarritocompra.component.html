<div class="container">
  <div style="text-align: center; margin: 5%;">
    <h1>Registro de Carrito de Compras</h1>
  </div>

  <div style="text-align: center; margin: 5%;">
    <form [formGroup]="form" (submit)="aceptar()">
      <!-- ID solo si estamos editando -->

      <br />

      <!-- Usuario -->
      <mat-form-field class="example-full-width">
        <mat-label>Usuario</mat-label>
        <input matInput placeholder="usuario123" formControlName="user" />
        <mat-error *ngIf="form.get('user')?.hasError('required')">
          El nombre de usuario es obligatorio!!
        </mat-error>
      </mat-form-field>

      <br />

      <!-- Producto -->
      <mat-form-field class="example-full-width">
        <mat-label>Producto</mat-label>
        <input matInput placeholder="Nombre del producto" formControlName="product" />
        <mat-error *ngIf="form.get('product')?.hasError('required')">
          El producto es obligatorio!!
        </mat-error>
      </mat-form-field>

      <br />

      <!-- Fecha -->
      <mat-form-field>
        <mat-label>Fecha</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="fecha" />
        <mat-hint>MM/DD/YYYY</mat-hint>
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-error *ngIf="form.get('fecha')?.hasError('required')">
          La fecha es obligatoria!!
        </mat-error>
      </mat-form-field>

      <br />

      <!-- Cantidad con botones -->
      <mat-form-field class="example-full-width">
        <mat-label>Cantidad</mat-label>
        <div style="display: flex; align-items: center;">
          <button mat-button type="button" (click)="disminuirCantidad()">-</button>
          <input
            matInput
            type="number"
            formControlName="cantidad"
            style="text-align: center;"
            min="1"
          />
          <button mat-button type="button" (click)="aumentarCantidad()">+</button>
        </div>
        <mat-error *ngIf="form.get('cantidad')?.hasError('required')">
          La cantidad es obligatoria!!
        </mat-error>
      </mat-form-field>

      <br />

      <button matButton="filled" [disabled]="form.invalid || form.get('cantidad')?.value <= 0">
        Aceptar
      </button>
    </form>
  </div>
</div>
