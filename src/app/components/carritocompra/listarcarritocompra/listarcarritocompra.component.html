<div class="container">
  <div style="text-align: center; margin: 6%">
    <h1>Lista de CarritoCompra</h1>
  </div>

  <div>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="c1">
        <th mat-header-cell *matHeaderCellDef>IDCarritoCompra</th>
        <td mat-cell *matCellDef="let element">{{ element.idCarritoCompra }}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="c2">
        <th mat-header-cell *matHeaderCellDef>Productos</th>
        <td mat-cell *matCellDef="let element">{{ element.nombreProducto }}</td>
      </ng-container>


      <!-- Symbol Column -->
      <ng-container matColumnDef="c3">
        <th mat-header-cell *matHeaderCellDef>Fecha de Creacion</th>
        <td mat-cell *matCellDef="let element">
          {{ element.fechaCreaCarritoCompra|date:'dd/MM/yyyy' }}
        </td>
      </ng-container>
      
      <!-- Symbol Column -->
      <ng-container matColumnDef="c4">
        <th mat-header-cell *matHeaderCellDef>Usuario</th>
        <td mat-cell *matCellDef="let element">{{ element.idUser }}</td>
      </ng-container>

<!-- Cantidad Column -->
<ng-container matColumnDef="c5">
  <th mat-header-cell *matHeaderCellDef>Cantidad</th>
  <td mat-cell *matCellDef="let element">
    <button mat-icon-button color="primary" (click)="disminuirCantidad(element)">
      <mat-icon>remove</mat-icon>
    </button>
    {{ element.cantidad }}
    <button mat-icon-button color="accent" (click)="aumentarCantidad(element)">
      <mat-icon>add</mat-icon>
    </button>
  </td>
</ng-container>

            <!-- Symbol Column -->
            <ng-container matColumnDef="c6">
              <th mat-header-cell *matHeaderCellDef>Eliminar</th>
              <td mat-cell *matCellDef="let element">
                <button matButton
                  (click)="eliminar(element.idCarritoCompra)"
                  >
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </ng-container>


      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
