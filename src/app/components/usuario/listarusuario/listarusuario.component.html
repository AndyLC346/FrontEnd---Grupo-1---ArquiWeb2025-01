<div class="container">

  <div style="text-align: center; margin: 6%;">
    <h1>Lista de Usuarios</h1>
  </div>

  <div class="tabla-contenedor">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 tabla-estilizada">

      <ng-container matColumnDef="c1">
        <th mat-header-cell *matHeaderCellDef> ID Usuario </th>
        <td mat-cell *matCellDef="let element"> {{element.idUser}} </td>
      </ng-container>

      <ng-container matColumnDef="c2">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let element"> {{element.username}} </td>
      </ng-container>

      <ng-container matColumnDef="c3">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let element"> {{element.enabled?'Activo':'Inactivo'}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
  <mat-paginator #paginator [length]="dataSource.data.length" [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons aria-label="Selecciona página">
  </mat-paginator>

  <h2>Cantidad de usuarios ({{ dataSource.filteredData.length }})</h2>
</div>
